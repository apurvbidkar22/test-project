apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: niraxo-website-ingress
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-production
    traefik.ingress.kubernetes.io/router.entrypoints: web, websecure
    traefik.ingress.kubernetes.io/router.tls: "true"
spec:
  ingressClassName: traefik
  rules:
    - host: placeholder.domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: niraxo-website
                port:
                  number: 80
  tls:
    - hosts:
        - placeholder.domain
      secretName: niraxo-website-tls

